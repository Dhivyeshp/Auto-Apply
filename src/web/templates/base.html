<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoApply{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">AutoApply</a>
    <nav>
      <a href="/" class="{{ 'on' if nav == 'inbox' else '' }}">Inbox</a>
      <a href="/chat" class="{{ 'on' if nav == 'chat' else '' }}">Fix the app</a>
    </nav>
    <span class="busy" id="busy"></span>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>

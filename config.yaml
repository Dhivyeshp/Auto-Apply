# Discovery filters for src/discover/simplify.py

db_path: data/autoapply.db

source:
  # Tried in order. The path has moved before, so keep a fallback.
  urls:
    - https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/main/.github/scripts/listings.json
  # more community lists; "season" format has no year/category/degrees: the year comes from the posting
  # date (or a year in the title) and the category from the title
  extra:
    - name: vanshb03
      format: season
      urls:
        - https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json
        - https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/main/.github/scripts/listings.json

# Normalized categories: swe, ml, hardware, pm, quant
categories:
  swe: true
  ml: true
  hardware: true
  pm: false
  quant: false

terms:
  - Summer 2027
  - Spring 2027
  - Fall 2027

title:
  include: [intern, internship, co-op, coop]
  # "staff engineer", not bare "staff": "Member of Technical Staff Intern" is a normal intern title
  exclude: [phd, mba, senior, staff engineer, staff software, principal]

locations:
  us_only: true          # non-US dropped unless a location is US or US-remote
  preferred: []              # locations to star and sort first, e.g. [TX, remote]; empty = all US equal

sponsorship:
  exclude_no_sponsorship: false       # drop "Does Not Offer Sponsorship"
  exclude_citizenship_required: false # drop "U.S. Citizenship is Required"

tailor:
  model: sonnet       # passed to `claude -p --model`; sonnet is lighter on Pro usage limits
  max_bullets: 15     # spec: pick top ~12-15
  min_score: 20       # bullets scored below this are never used
  coverage_threshold: 50  # flag resumes matching fewer JD keywords than this (%)
  target_rating: 9          # below this, Claude reworks the resume from your real bullets and re-rates
  improve_rounds: 2         # max rework rounds per job (each = 2 Claude calls); best version wins
  pdf_name: Dhivyesh_Resume_{type}  # file name employers see; {type} comes from the job's category below
  pdf_types:                 # job category (from the JD) → {type}
    swe: SWE
    fde: SWE
    pm_adjacent: SWE
    hardware: SWE
    ml: ML
    data: ML

batch:
  parallel: 3               # resumes tailored / forms prepared at once (Claude Pro rate limits)
  top: 8                    # jobs per batch when you don't list ids
  min_rating: 7             # skip resumes Claude rates below this (after improvement rounds)

watch:
  auto_tailor: true          # pre-tailor + rate new jobs so alerts say "8/10 ready"
  ats: [greenhouse, lever, ashby]   # only jobs the apply bot can fill get pre-tailored
  max_tailor_per_run: 5      # each tailor = 4 Claude calls on your Pro plan
  max_tailor_per_day: 20

# Put real topics/webhooks in config.local.yaml (gitignored), not here: this file is public.
notify:
  toast: true                # Windows notification
  ntfy_topic: ""             # ntfy topic for phone pushes (GitHub Actions uses the NTFY_TOPIC secret instead)
  discord_webhook: ""
  ready_push: true           # after pre-tailoring, push "Ready: Company — Role 8/10" with a tap-to-apply link
  attach_resume: false       # also attach the tailored PDF to that push (uploads it to ntfy.sh for ~3 hours)
  sync_dir: ""               # copy each tailored PDF here, e.g. ~/OneDrive/AutoApply, to open it on your phone
